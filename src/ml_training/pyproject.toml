[project]
name = "ml-training"
version = "0.1.0"
description = "SignalForge ML training pipeline -- offline model training, validation, and export"
requires-python = ">=3.14"
dependencies = [
    "lightgbm>=4.6.0",
    "scikit-learn>=1.6.0",
    "joblib>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=2.2.0",
    "pyarrow>=19.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "shap>=0.46.0",
    "mapie>=0.9.0",
    "scipy>=1.15.0",
    "tqdm>=4.67.0",
]

[project.scripts]
ml-train = "ml_training.pipeline.cli:main"

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.9.4,<0.10.0"]

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "C901", "B905"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
"tests/**" = ["S101", "PLR2004", "D"]

[tool.ruff.lint.isort]
known-first-party = ["ml_training"]

[tool.ty.environment]
root = ["."]
python-version = "3.14"

[tool.ty.terminal]
output-format = "full"
error-on-warning = false

[dependency-groups]
dev = [
    "ruff>=0.15.7",
    "ty>=0.0.24",
]
judge = [
    "crepes>=0.9.0",
]
