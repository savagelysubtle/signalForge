[project]
name = "signalforge-mcp"
version = "0.1.0"
description = "MCP server for SignalForge pipeline and IBKR trade execution"
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "ib_async>=2.0.0",
]

[project.scripts]
signalforge-mcp = "mcp_server.server:main"

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.9.4,<0.10.0"]

[tool.setuptools]
packages = { find = { where = ["."], include = ["mcp_server*"] } }

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
    "B008",
    "C901",
    "B905",
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_server"]

[tool.ty.environment]
root = ["."]
python-version = "3.14"

[tool.ty.terminal]
output-format = "full"
error-on-warning = false

[dependency-groups]
dev = [
    "ruff>=0.15.7",
    "ty>=0.0.24",
]
